<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ระบบการตรวจความสะอาดเขตพื้นที่ - โรงเรียนเทพศิรินทร์พุแค สระบุรี</title>
  <meta name="description" content="ระบบการตรวจความสะอาดเขตพื้นที่ กลุ่มกิจการนักเรียน โรงเรียนเทพศิรินทร์พุแค สระบุรี ผู้พัฒนาระบบ: นายนิมิต ศรีวัฒนะ">
  <meta name="author" content="นายนิมิต ศรีวัฒนะ">
  <meta name="theme-color" content="#1E5B34">

  <!-- ไอคอนแท็บเบราว์เซอร์และหน้าจอโฮม (ตราโรงเรียนเทพศิรินทร์พุแค สระบุรี) -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ตรวจความสะอาด">

  <style>
    html, body { margin: 0; height: 100%; }
    /* แถบบนสีเขียวเข้ากับหัวเว็บ แถบล่างสีขาวเข้ากับเมนูล่างบนมือถือ */
    body { background: linear-gradient(#1E5B34 50%, #FFFFFF 50%); }
    #app {
      position: fixed;
      top: env(safe-area-inset-top);
      right: env(safe-area-inset-right);
      bottom: env(safe-area-inset-bottom);
      left: env(safe-area-inset-left);
      width: calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right));
      height: calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      border: 0;
      display: block;
      background: #EDF1E8;
    }
    noscript a { display: block; padding: 24px; font: 16px/1.5 sans-serif; color: #fff; }
  </style>
</head>
<body>
  <iframe id="app" title="ระบบการตรวจความสะอาดเขตพื้นที่ โรงเรียนเทพศิรินทร์พุแค สระบุรี" allow="clipboard-write"></iframe>

  <noscript>
    <a href="https://script.google.com/macros/s/AKfycbyvOh3_sTodtCu1tDdg6gPrRQ15V6RZKQrfE-8nT_gCYhISyU85i1jDqDUKlP0IFBuADw/exec">เปิดระบบการตรวจความสะอาดเขตพื้นที่</a>
  </noscript>

  <script>
    // ลิงก์เว็บแอป Apps Script (/exec) ถ้าทำให้ใช้งานได้ใหม่แล้วลิงก์เปลี่ยน ให้แก้บรรทัดนี้บรรทัดเดียว
    var EXEC_URL = 'https://script.google.com/macros/s/AKfycbyvOh3_sTodtCu1tDdg6gPrRQ15V6RZKQrfE-8nT_gCYhISyU85i1jDqDUKlP0IFBuADw/exec';

    // ส่งลิงก์หน้านี้ให้ระบบ เพื่อให้ปุ่ม "คัดลอกลิงก์ระบบ" คัดลอกลิงก์ GitHub Pages
    var shareUrl = location.origin + location.pathname;
    document.getElementById('app').src = EXEC_URL + '?share=' + encodeURIComponent(shareUrl);
  </script>
</body>
</html>
